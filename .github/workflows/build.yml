name: Validate OpenWrt installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mdm-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore and validate source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat source/bundle.part{01..09} > "$RUNNER_TEMP/mdm-source.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/mdm-source.tar.gz.b64" > "$RUNNER_TEMP/mdm-source.tar.gz"
          gzip -t "$RUNNER_TEMP/mdm-source.tar.gz"
          mkdir -p "$RUNNER_TEMP/mdm-source"
          tar -xzf "$RUNNER_TEMP/mdm-source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/mdm-source"
          "$RUNNER_TEMP/mdm-source/check-source.sh"
          test -f "$RUNNER_TEMP/mdm-source/luci-app-my-device-manager/root/usr/share/luci/menu.d/luci-app-my-device-manager.json"
          test -f "$RUNNER_TEMP/mdm-source/luci-app-my-device-manager/root/usr/share/rpcd/acl.d/luci-app-my-device-manager.json"

      - name: Inspect RPC registration parser (temporary diagnostic)
        if: contains(github.event.head_commit.message, '[diagnostic]')
        shell: bash
        run: |
          set -euo pipefail
          backend="$RUNNER_TEMP/mdm-source/luci-app-my-device-manager/root/usr/libexec/rpcd/luci.my_device_manager"
          echo '=== Base read_arg/input handling ==='
          grep -n -E 'input=|read input|read -r input|read_arg\(\)|name_required' "$backend" || true
          echo '=== Base registration handler ==='
          grep -n -A55 -B15 -E 'register\|rename\)' "$backend" || true
          echo '=== Base RPC schema ==='
          grep -n -A3 -B3 -E '"register"|"rename"' "$backend" || true

      - name: Validate installer and prepare download artifact
        shell: bash
        run: |
          set -euo pipefail
          sh -n install.sh
          sh install.sh check
          # Re-run under BusyBox shell and BusyBox applets to catch OpenWrt portability regressions.
          sudo apt-get update
          sudo apt-get install -y busybox
          mkdir -p "$RUNNER_TEMP/busybox-bin"
          busybox --install -s "$RUNNER_TEMP/busybox-bin"
          PATH="$RUNNER_TEMP/busybox-bin:$PATH" busybox sh install.sh check
          grep -Fq 'SOURCE_REF="269211b675fd174053284591af1ec59e68cb2de0"' install.sh
          mkdir -p artifacts
          cp install.sh artifacts/install.sh
          sha256sum artifacts/install.sh > artifacts/install.sh.sha256
          cat > artifacts/INSTALL.txt <<'EOF'
          My Device Manager — direct installer for OpenWrt 25.12.x (v0.2.21)
          
          Run as root:
            wget -O /root/mdm-install.sh https://github.com/MakeHomeWiFiGood/my-device-manager/releases/download/v0.2.21/install.sh
            sh /root/mdm-install.sh install
          
          To remove the installed app and restore files backed up by the installer:
            sh /root/mdm-install.sh uninstall
          
          Requires LuCI and access to raw.githubusercontent.com.
          Registration is split into two steps: “Зарегистрировать” stores the client in My Device Manager only; “Зарегистрировать DHCP-запись” separately creates a checked static DHCP reservation. Per-device Wi-Fi band selection is supported for registered clients; changing restrictions may briefly reload Wi-Fi. Per-device speed enforcement is not implemented. The app does not change mwan3, Tachyon, proxy routing, or firewall policies.
          EOF

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-device-manager-installer
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish My Device Manager v0.2.21 — opt-in registration diagnostics
        if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[diagnostic]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.21
          target_commitish: ${{ github.sha }}
          name: My Device Manager v0.2.21 — opt-in registration diagnostics
          overwrite_files: true
          generate_release_notes: true
          files: artifacts/*
          body: |
            Fixes BusyBox MAC normalization: whitespace is removed with `sed` rather than `tr -d '[:space:]'`,
            avoiding deletion of literal characters from MAC addresses on the router. Tests use a synthetic MAC fixture,
            not a real device's address.
            Splits device registration into two independent operations: “Зарегистрировать”
            stores the device in My Device Manager only and does not edit DHCP, while
            “Зарегистрировать DHCP-запись” separately validates the IPv4 address, refuses conflicts
            with existing static DHCP reservations, and creates a normal OpenWrt DHCP host.
            The first “Зарегистрировать” action stores the client only in the My Device Manager registry and normalizes common MAC notations before the record is written. This release replaces older MAC normalizers instead of trusting an existing version marker, and adds explicit output when a normalization test fails. The separate “Зарегистрировать DHCP-запись” action retains MAC/IP validation
            and reservation conflict checks. Its button is shown only for registered devices with an IP address and is omitted when a static reservation already exists. MAC input accepts common colon/hyphen/dot, compact, upper/lowercase and surrounding-whitespace variants after normalization.
            Fixes installer validation by forcibly upgrading the normalizer implementation and testing uppercase, lowercase, colon, hyphen, dotted, compact and surrounding-whitespace forms with diagnostic output on failure.
            Adds an opt-in registration diagnostics toggle in LuCI. When enabled, the RPC backend
            records the normalized MAC for registration attempts and internal error codes in
            /tmp/my-device-manager.log. The log is RAM-only, capped, cleared when diagnostics are enabled
            again, and does not contain device names, IP addresses or Wi-Fi passwords. Logging is disabled
            by default and does not persist across a reboot.
            Adds persistent per-device Wi-Fi band selection for registered devices:
            2.4 GHz only, 5 GHz only, or both bands without an MDM-created restriction
            (the client chooses its band). Unregistered clients are marked
            "Устройство не зарегистрировано". Applying a restriction may briefly
            reload Wi-Fi; the installer checks for a matching SSID and security
            settings on the permitted band before applying it, refuses conflicting
            manual allow-lists, and only removes ACL entries created by MDM.
            Unregistering a device or uninstalling MDM removes its owned restrictions.
            The app does not change firewall, mwan3, Tachyon, tc, or proxy routing.
            Also includes the earlier fixes: executable rpcd handler, mDNS discovery,
            optional UFP fingerprints, Wi-Fi link telemetry, and independent parsing
            of Wi-Fi counters. UFP is not installed by this installer.
            CI checks the source bundle, installer patch paths and shell syntax;
            live validation on the target router remains pending.
