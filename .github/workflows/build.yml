name: Validate OpenWrt installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mdm-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore and validate source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat source/bundle.part{01..09} > "$RUNNER_TEMP/mdm-source.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/mdm-source.tar.gz.b64" > "$RUNNER_TEMP/mdm-source.tar.gz"
          gzip -t "$RUNNER_TEMP/mdm-source.tar.gz"
          mkdir -p "$RUNNER_TEMP/mdm-source"
          tar -xzf "$RUNNER_TEMP/mdm-source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/mdm-source"
          "$RUNNER_TEMP/mdm-source/check-source.sh"
          test -f "$RUNNER_TEMP/mdm-source/luci-app-my-device-manager/root/usr/share/luci/menu.d/luci-app-my-device-manager.json"
          test -f "$RUNNER_TEMP/mdm-source/luci-app-my-device-manager/root/usr/share/rpcd/acl.d/luci-app-my-device-manager.json"

      - name: Validate installer and prepare download artifact
        shell: bash
        run: |
          set -euo pipefail
          sh -n install.sh
          sh install.sh check
          grep -Fq 'SOURCE_REF="fd659704f3f5a236b8e0b3b2fabd121b10a65470"' install.sh
          mkdir -p artifacts
          cp install.sh artifacts/install.sh
          sha256sum artifacts/install.sh > artifacts/install.sh.sha256
          cat > artifacts/INSTALL.txt <<'EOF'
          My Device Manager — direct installer for OpenWrt 25.12.x
          
          Run as root:
            wget -O /root/mdm-install.sh https://github.com/MakeHomeWiFiGood/my-device-manager/releases/download/v0.2.2/install.sh
            sh /root/mdm-install.sh install
          
          To remove the installed app and restore files backed up by the installer:
            sh /root/mdm-install.sh uninstall
          
          Requires LuCI and access to raw.githubusercontent.com.
          This is an early scaffold. Wi-Fi band enforcement and per-device speed
          enforcement are not implemented. It does not configure mwan3, Tachyon,
          proxy routing, or other firewall policies.
          EOF

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-device-manager-installer
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish fixed installer release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.2
          target_commitish: ${{ github.sha }}
          name: My Device Manager v0.2.2 — BusyBox-compatible installer
          overwrite_files: true
          generate_release_notes: true
          files: artifacts/*
          body: |
            Fixes extraction on OpenWrt systems using BusyBox tar. No GNU-only
            --strip-components option is used; the archive is validated and
            extracted into a private temporary directory before locating the
            app source tree. This installer was syntax-checked and tested against
            the source bundle in CI, but has not been live-tested on a router.
            It does not configure mwan3, Tachyon, proxy routing, or firewall policies.
