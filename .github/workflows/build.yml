name: Validate OpenWrt installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mdm-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore and validate source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat source/bundle.part{01..09} > "$RUNNER_TEMP/mdm-source.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/mdm-source.tar.gz.b64" > "$RUNNER_TEMP/mdm-source.tar.gz"
          gzip -t "$RUNNER_TEMP/mdm-source.tar.gz"
          mkdir -p "$RUNNER_TEMP/mdm-source"
          tar -xzf "$RUNNER_TEMP/mdm-source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/mdm-source"
          "$RUNNER_TEMP/mdm-source/check-source.sh"
          test -f "$RUNNER_TEMP/mdm-source/luci-app-my-device-manager/root/usr/share/luci/menu.d/luci-app-my-device-manager.json"
          test -f "$RUNNER_TEMP/mdm-source/luci-app-my-device-manager/root/usr/share/rpcd/acl.d/luci-app-my-device-manager.json"

      - name: Validate installer and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          sh -n install.sh
          sh install.sh check
          grep -Fq 'SOURCE_REF="fd659704f3f5a236b8e0b3b2fabd121b10a65470"' install.sh
          mkdir -p artifacts
          cp install.sh artifacts/install.sh
          sha256sum artifacts/install.sh > artifacts/install.sh.sha256
          cat > artifacts/INSTALL.txt <<'EOF'
          My Device Manager — direct installer for OpenWrt 25.12.x
          
          Run as root:
            wget -O /tmp/mdm-install.sh https://github.com/MakeHomeWiFiGood/my-device-manager/releases/latest/download/install.sh
            sh /tmp/mdm-install.sh install
          
          To remove the installed app and restore files backed up by the installer:
            sh /root/mdm-install.sh uninstall
          
          Requires LuCI and access to raw.githubusercontent.com.
          This is an early scaffold. Wi-Fi band enforcement and per-device speed
          enforcement are not implemented. It does not configure mwan3, Tachyon,
          proxy routing, or other firewall policies.
          EOF

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-device-manager-installer
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Check whether initial release exists
        id: release_check
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: (github.ref == 'refs/heads/main' && steps.release_check.outputs.exists == 'false') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.1' }}
          target_commitish: ${{ github.sha }}
          name: My Device Manager ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.1' }} — script installer
          generate_release_notes: true
          files: artifacts/*
          body: |
            Script-based installer for the early My Device Manager LuCI scaffold,
            targeting OpenWrt 25.12.x. Download install.sh and run it as root.
            
            Requires LuCI and access to raw.githubusercontent.com. It backs up
            files it overwrites, preserves existing /etc/config/my_device_manager,
            and supports uninstall/restore. Wi-Fi band enforcement and per-device
            rate shaping are not implemented. It does not configure mwan3,
            Tachyon, proxy routing, or other firewall policies.
