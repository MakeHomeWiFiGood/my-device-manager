name: Validate OpenWrt installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mdm-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore and validate source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat source/bundle.part{01..09} > "$RUNNER_TEMP/mdm-source.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/mdm-source.tar.gz.b64" > "$RUNNER_TEMP/mdm-source.tar.gz"
          gzip -t "$RUNNER_TEMP/mdm-source.tar.gz"
          mkdir -p "$RUNNER_TEMP/mdm-source"
          tar -xzf "$RUNNER_TEMP/mdm-source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/mdm-source"
          "$RUNNER_TEMP/mdm-source/check-source.sh"
          test -f "$RUNNER_TEMP/mdm-source/luci-app-my-device-manager/root/usr/share/luci/menu.d/luci-app-my-device-manager.json"
          test -f "$RUNNER_TEMP/mdm-source/luci-app-my-device-manager/root/usr/share/rpcd/acl.d/luci-app-my-device-manager.json"


      - name: Validate installer and prepare download artifact
        shell: bash
        run: |
          set -euo pipefail
          sh -n install.sh
          sh install.sh check
          # Re-run under BusyBox shell and BusyBox applets to catch OpenWrt portability regressions.
          sudo apt-get update
          sudo apt-get install -y busybox
          mkdir -p "$RUNNER_TEMP/busybox-bin"
          busybox --install -s "$RUNNER_TEMP/busybox-bin"
          PATH="$RUNNER_TEMP/busybox-bin:$PATH" busybox sh install.sh check
          grep -Fq 'SOURCE_REF="269211b675fd174053284591af1ec59e68cb2de0"' install.sh
          mkdir -p artifacts
          cp install.sh artifacts/install.sh
          sha256sum artifacts/install.sh > artifacts/install.sh.sha256
          cat > artifacts/INSTALL.txt <<'EOF'
          My Device Manager — direct installer for OpenWrt 25.12.x (v0.2.28)
          
          Run as root:
            wget -O /root/mdm-install.sh https://github.com/MakeHomeWiFiGood/my-device-manager/releases/download/v0.2.28/install.sh
            sh /root/mdm-install.sh check
            sh /root/mdm-install.sh reinstall
          
          To remove the installed app and restore files backed up by the installer:
            sh /root/mdm-install.sh uninstall
          
          Requires LuCI and access to raw.githubusercontent.com.
          The app discovers clients from DHCP/mDNS/neighbours and hostapd; users do not register devices in the app or create DHCP reservations through it. Band selection is offered for discovered MAC addresses and applying a restriction may briefly reload Wi-Fi. The installer itself does not change Wi-Fi, DHCP, firewall, mwan3, Tachyon or proxy routing.
          EOF

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-device-manager-installer
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish My Device Manager v0.2.28 — simplified discovery and Wi-Fi band controls
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.28
          target_commitish: ${{ github.sha }}
          name: My Device Manager v0.2.28 — simplified discovery and Wi-Fi band controls
          overwrite_files: true
          generate_release_notes: true
          files: artifacts/*
          body: |
            v0.2.28 simplifies the interface: devices are discovered from DHCP/mDNS/neighbour and hostapd data; there are no device registration or DHCP-registration controls in LuCI. Every discovered MAC has a band selector: 2.4 GHz only, 5 GHz only, or both bands with no MDM-created restriction so the client chooses.
            Per-device restrictions are saved on demand and keyed by MAC; merely viewing a client does not create a record. Applying a restriction can reload Wi-Fi, but installation/reinstallation does not change wireless configuration. The backend verifies compatible SSID/security on the permitted band and refuses conflicts with manual allow-lists or ambiguous MAC filters. Only ACL changes owned by MDM are removed when returning to both bands.
            The RPC argument reader is forced to the jshn implementation under a new marker so an older marker cannot leave the broken jsonfilter implementation in place. Device names remain local: no client inventory or statistics are uploaded by the app.
            The app does not change firewall rules, tc, mwan3, Tachyon, proxy routing, or DHCP reservations. mDNS and UFP are optional and are not installed/enabled by this installer.
            CI validates the source bundle, shell syntax, patch markers and installer. Live validation on the target router is still required.
